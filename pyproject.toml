[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openreynolds"
dynamic = ["version"]
description = "A UI-less CFD agent: an Anthropic tool-use loop over a real OpenFOAM workspace."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "InviscidAI", email = "kabir@inviscidai.com" }]
keywords = ["cfd", "openfoam", "agent", "llm", "simulation", "fluid-dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=1.0,<2",
    "openai>=1.50,<4",
    "httpx2[socks]>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "textual>=8.0",
    # `openreynolds mcp`: a standard part of the install, so it works however
    # OpenReynolds was installed (pip, uvx, pipx or the npm launcher).
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/InviscidAI/OpenReynolds"
Repository = "https://github.com/InviscidAI/OpenReynolds"
Issues = "https://github.com/InviscidAI/OpenReynolds/issues"

[project.optional-dependencies]
# numpy/matplotlib/pandas/pyvista are what the container provides; the toolbox tests
# exercise the same parsing locally, so CI needs them too.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyvista>=0.47",  # extract_surface(algorithm=...) is new in 0.47
    # The kernel channel's own tests run a real kernel against `LocalBackend`.
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
]
# Kept so `pip install 'openreynolds[mcp]'` from older instructions still works: the
# MCP server is now part of the standard install.
mcp = []
# `openreynolds video` prefers a real ffmpeg on PATH; imageio is the fallback encoder.
# The ffmpeg extra is part of it: `imageio` alone writes a GIF and raises on an mp4,
# which is the container `video.py` and `toolbox/encode.py` reach for first. The image
# installs `imageio[ffmpeg]` for that reason (docker/workspace/Dockerfile).
video = ["imageio[ffmpeg]>=2.31"]
# The cell channel the CAD desk works in. These belong to the *workspace image*, not to
# this package: `backend/kernel.py` writes a driver into the workspace and the driver
# imports `jupyter_client` and starts an `ipykernel` there, on the far side of the
# protocol. They are declared here so the image has one place that says what it owes,
# and so a developer running the kernel tests against a local backend gets them.
kernel = [
    "ipykernel>=6.29",
    "jupyter_client>=8.6",
]
# The toolbox scripts run on the instance, where these are already installed. This
# extra is for running them on the user's own machine, and it used to declare four of
# the eight third-party modules the toolbox imports, so four scripts raised ImportError
# off the documented install (#204). The split is by download size, because the point of
# running the toolbox locally is post-processing on a laptop:
#
#   toolbox  numpy, matplotlib, pandas, pyvista, imageio -- tens of MB, and between
#            them they run 30 of the 32 scripts that import anything third-party.
#   cad      gmsh, build123d, OCP -- hundreds of MB for two scripts, `cad_convert.py`
#            and `cad_export.py`.
#
# Every third-party import in the toolbox is in one of the two, which is what
# tests/test_toolbox_extras.py checks: nothing is left to a comment.
toolbox = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyvista>=0.47",  # extract_surface(algorithm=...) is new in 0.47
    "imageio[ffmpeg]>=2.31",  # encode.py; the ffmpeg plugin is what writes the mp4
]
# `cad_convert.py` (gmsh) and `cad_export.py` (build123d, and OCP for the triangulation
# build123d does not expose). Pinned exactly, and to the same versions as
# docker/workspace/Dockerfile, for the reason #132 pinned them there: `build123d>=0.9`
# resolved to 0.9.x when that floor was written and later to 0.11, and the OCP that came
# with it broke production for four days. A floor is not reproducible, and a user
# post-processing locally against `b123d_api.md` -- which documents 0.11.1's API -- wants
# the software the hosted run had, not whatever resolves today. The pins are asserted
# equal to the Dockerfile's ARGs by a test, so the two cannot drift silently.
cad = [
    "gmsh==4.15.2",
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
]
# `openreynolds/live/`: the GPU lattice Boltzmann backend and its Newton coupling, run
# on the user's own machine by `openreynolds live` and by the agent's `live_sim` tool.
#
# An extra, and not a dependency, for the reason the whole extension is arranged
# around: this is a CUDA toolchain and a robotics simulator, and core OpenReynolds
# talks to a remote OpenFOAM workspace that needs neither. `openreynolds/live/__init__.py`
# resolves every name lazily and `tests/test_live_optional.py` hides Warp from the
# import system to prove the core still imports without any of this, because the
# alternative is a laptop with no GPU where `openreynolds --help` fails.
#
# Licences, read out of the installed wheels' own metadata rather than taken from a
# README (the brief allows permissive dependencies only):
#
#   warp-lang 1.19.0    Apache-2.0 (METADATA `License: Apache-2.0`), and its only
#                       hard requirement is numpy. It vendors Gaia and appdirs, both
#                       with their licence files shipped in the wheel.
#   newton 1.8.0        Apache-2.0 (`License-Expression`), hard requirement warp-lang
#                       >=1.17 and nothing else; the importers, viewers and torch are
#                       all extras we do not take. Its CC-BY-4.0 file covers example
#                       assets, not code.
#   mujoco-warp 4.0.1   Apache-2.0 (`License-Expression`), pulling absl-py,
#                       etils[epath], mujoco-core (Apache-2.0 too) and numpy. JAX is
#                       behind its `cpu`/`cuda` extras, so it is not installed here --
#                       which is the difference from XLB that decided D1 in
#                       DECISIONS_LIVE.md, where JAX is a core requirement.
#
# Named directly rather than through `newton[sim]`: that extra pins `mujoco-warp`
# itself, and it pins it differently per Newton -- `~=3.12.0` at newton 1.6.1 and
# `~=3.17.0` at newton 1.8.0 -- while the version this was built and measured against is
# 4.0.1. Nothing in `openreynolds/live/` imports mujoco: `SolverMuJoCo` is an object the
# caller constructs and hands to `NewtonCoupling`, so this floor belongs to whoever
# chooses that solver and the pair that is actually exercised here is
# newton 1.8.0 + mujoco-warp 4.0.1 (Newton warns about the mismatch and runs). The floor
# is 3.12 and not 4.0 so that the extra can be installed beside newton 1.6.1 at all.
#
# ## The range, and what measured it
#
# The bands below are `docs/live-version-matrix.md`, which is two environments run
# end to end rather than a guess at what might work:
#
#   warp-lang 1.19.0 + newton 1.8.0   the development environment
#   warp-lang 1.17.0 + newton 1.6.1   what Isaac Lab 3.0.0's own metadata pins
#                                     (`warp-lang==1.17.0`, `newton[sim]==1.6.1`), so
#                                     what a user running this inside Isaac Lab gets
#                                     no matter what this table asks for
#
# On both: the extension imports, every kernel compiles, the Re 100 lid-driven cavity
# comes out **bit-identical** (same SHA-1 over the saved velocity plane), a three-step
# `NewtonCoupling` over a voxelised sphere gives the same 552 solid nodes and the same
# wrench to the last float, and zero-copy sharing holds by pointer in both directions
# between Warp, Newton and torch. No source change was needed to reach that: every Warp
# symbol the kernels use behaves identically on 1.17.0 and 1.19.0, and every Newton
# field, `GeoType` name, `GeoType` value and `shape_scale` component the adapter reads
# is unchanged between 1.6.1 and 1.8.0.
#
# The upper bounds are exclusive minors, not open ends, because an open end is a claim
# about releases that do not exist yet. 1.18 was not installed: it sits between two that
# agree bit for bit, which is weaker than a run and stronger than nothing.
# `openreynolds/live/units.py::WARP_TESTED` carries the same band in code, and
# `tests/test_live_versions.py` asserts the two agree so the declared range and the
# tested range cannot drift apart.
#
# What is *not* claimed: no GPU was available, so the CUDA path is untested on either
# (`DECISIONS_LIVE.md` D7). The one measured difference is speed, not answers -- the
# step loop runs at 1.11 MLUPS on warp 1.17.0 against 3.51 on 1.19.0 on the same CPU,
# which is 1.17.0's code generation for the two large kernels and not `max_unroll` (the
# option is honoured by both) and not launch overhead (8.06 against 8.52 us a launch).
#
# numpy and matplotlib are the extension's own, not borrowed from `dev`: `live/world.py`
# and `live/lattice.py` import numpy when they are read, and every case draws its
# figure. The floors are the ones the rest of this table already uses, so one
# environment can serve the toolbox and the live backend together.
live = [
    "warp-lang>=1.17,<1.20",
    "newton>=1.6,<1.9",
    "mujoco-warp>=3.12",
    "numpy>=1.24",
    "matplotlib>=3.7",
]
[project.scripts]
openreynolds = "openreynolds.cli:main"

[tool.hatch.version]
path = "openreynolds/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openreynolds"]

[tool.hatch.build.targets.sdist]
# Local study mirrors, user-test transcripts and the engineering scaffolding are
# not part of what someone installs.
exclude = [
    "launcher/",
    "studies/",
    "user-test*.log",
    "scripts/",
    "benchmarks/",
    ".github/",
    ".githooks/",
    "docs/",
    ".claude/",
    "*.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# matplotlib's vendored pyparsing is noisy on import; keep real warnings visible.
filterwarnings = ["ignore::pyparsing.PyparsingDeprecationWarning"]
asyncio_mode = "auto"
# `-m gpu` selects the live backend's GPU tests. They are ALSO guarded by a skipif on
# there actually being a CUDA device (tests/test_live_cases.py::needs_a_gpu), which is
# the repo's existing convention -- conftest.needs_a_kernel does the same thing for a
# workspace. The marker is for selecting them on a machine that has one; the skipif is
# for not failing on a machine that does not.
markers = [
    "gpu: needs a CUDA device; skipped automatically where there is none",
]
