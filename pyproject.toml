[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openreynolds"
version = "0.1.0"
description = "A UI-less CFD agent: an Anthropic tool-use loop over a real OpenFOAM workspace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=1.0.0",
    "httpx2>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
openreynolds = "openreynolds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openreynolds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
