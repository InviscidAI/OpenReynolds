name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build a wheel and check the toolbox ships in it
        # The wheel is pure Python and identical on every OS; one build is enough.
        if: runner.os == 'Linux'
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          expected = {
              "openreynolds/toolbox/log_digest.py",
              "openreynolds/toolbox/mesh_digest.py",
              "openreynolds/toolbox/render.py",
              "openreynolds/toolbox/cells_estimate.py",
              "openreynolds/toolbox/notes/openfoam-field-notes.md",
          }
          missing = expected - set(names)
          assert not missing, f"missing from the wheel: {sorted(missing)}"
          print(f"toolbox ships: {len(expected)} files present")
          PY
